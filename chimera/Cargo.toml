[package]
name = "chimera"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = {version = "0.4.38", features = ["serde"]}
clap = {version = "4.5.20", features = ["cargo", "std"]}
env_logger = "0.11.5"
futures = "0.3.31"
local-ip-address = "0.6.3"
log = "0.4.22"
once_cell = "1.20.2"
serde = {version = "1.0.214", features = ["derive"]}
serde_json = "1.0.132"
sysinfo = "0.29.11"
thiserror = "2.0.3"


[dev-dependencies]
tempfile = "3.14.0"

[target.'cfg(unix)'.dependencies.tokio]
version = "1.48.0"
features = ["fs", "io-util", "net", "process", "rt-multi-thread", "macros", "sync", "time"]

[target.'cfg(windows)'.dependencies.tokio]
version = "1.48.0"
features = ["fs", "io-util", "net", "process", "rt-multi-thread", "macros", "signal", "time"]

[target.'cfg(unix)'.dependencies]
which = "7.0.0"

[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.17.0"

# Windows only dependencies
[target.'cfg(windows)'.dependencies]
windows-sys = { version= "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_NetworkManagement", 
    "Win32_NetworkManagement_NetManagement",
    "Win32_System_Wmi",
    "Win32_System_Com",
    "Win32_System_SystemServices",
    "Win32_System_Services", "Win32_Foundation"] }
wmi = "0.14.2"
netstat = "0.7.0"
