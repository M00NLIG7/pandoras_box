[package]
name = "rustrc"
version = "1.1.0"
edition = "2021"
rust-version = "1.94.1"
license = "MIT"
repository = "https://github.com/M00NLIG7/pandoras_box"
description = "SSH execution and SFTP transport primitives for Pandora's Box"
publish = false

[dependencies]
russh = { version = "0.62.6", default-features = false, features = ["ring"] }
russh-sftp = "2.4.0"
thiserror = "1.0.63"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
tracing = "0.1.41"
zeroize = "1.8.1"
