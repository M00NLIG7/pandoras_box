[package]
name = "pandoras_box"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.89"
clap = {version = "4.5.17", features = ["cargo"]}
futures = "0.3.30"
libc = "0.2.177"
thiserror = "1.0.63"
tokio = {version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"]}
rustrc = { path = "../rustrc" }
log = "0.4.22"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
zeroize = "1.8.1"
# Public, immutable SMB implementation used by clean checkouts and CI.
smolder_tools = { package = "smolder", git = "https://github.com/M00NLIG7/smolder.git", rev = "05cad6854d6044a1af659693ba202c3de5285d57" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
env_logger = "0.11.5"
